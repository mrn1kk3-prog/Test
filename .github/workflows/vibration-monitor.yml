name: Ultimate Vibration Analyzer APK
on:
  push:
    branches: [main, 'feature/ultimate-vibration-analyzer']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests, lint and APK
        run: gradle testDebugUnitTest lintDebug assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: app/build/reports
      - uses: actions/upload-artifact@v4
        with:
          name: UltimateVibrationAnalyzer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
  ui-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            gradle connectedDebugAndroidTest --stacktrace
            adb pull /sdcard/Android/data/com.example.vibrationmonitor.v02/files ui-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-ui-validation
          path: |
            app/build/reports/androidTests
            ui-screenshots
