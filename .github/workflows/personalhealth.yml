      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build debug APK
        working-directory: project
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/debug/app-debug.apk PersonalHealth-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PersonalHealth-APK
          path: project/PersonalHealth-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PersonalHealth-build-log
          path: project/build.log
          if-no-files-found: ignore
